<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#1a1a2e}
.header{background:linear-gradient(135deg,#1e3a5f,#2980b9);color:#fff;padding:24px 36px;display:flex;align-items:center;gap:18px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.header h1{font-size:1.4rem;font-weight:700}.header p{font-size:.82rem;opacity:.8;margin-top:3px}
.hicon{font-size:2.2rem}
.sbar{background:#fff;border-bottom:1px solid #dde3ea;padding:14px 36px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.sbar label{font-weight:700;font-size:.9rem;color:#1e3a5f;white-space:nowrap}
.sbar select{flex:1;min-width:260px;max-width:500px;padding:9px 12px;border:2px solid #2980b9;border-radius:8px;font-size:.93rem;background:#fff;cursor:pointer;outline:none;font-family:inherit}
.tabs{display:flex;gap:6px;margin-left:auto}
.tb{padding:8px 16px;border:2px solid #dde3ea;background:#fff;border-radius:8px;cursor:pointer;font-size:.83rem;font-weight:700;color:#6c7a8d;transition:all .2s;font-family:inherit}
.tb.on{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
.main{padding:24px 36px;max-width:1280px;margin:0 auto}
.ocard{background:#fff;border-radius:14px;padding:22px 26px;margin-bottom:20px;border:1px solid #dde3ea;display:flex;gap:28px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.05)}

.otag{background:#eef3f9;border-radius:20px;padding:4px 11px;font-size:.79rem;color:#1e3a5f}

.scpanel{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:150px}

.sccircle small{font-size:.72rem;font-weight:400;opacity:.85}
.sclabel{font-size:.93rem;font-weight:700;text-align:center}
.scsub{font-size:.74rem;color:#6c7a8d;margin-top:3px;text-align:center}
.dcards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}

.dmax{font-size:.68rem;color:#6c7a8d}

<script>
var RAW = JSON.parse(document.getElementById('dataScript').textContent);
var ORGS = RAW.orgs;
var QLABELS = RAW.q_labels;
var DIMS = ["Estrategia y Liderazgo Digital","Gestión de Procesos","Tecnología e Infraestructura","Datos e Impacto","Talento y Cultura Digital"];
var ICONS = {"Estrategia y Liderazgo Digital":"🎯","Gestión de Procesos":"⚙️","Tecnología e Infraestructura":"💻","Datos e Impacto":"📊","Talento y Cultura Digital":"🧠"};
var DCOL = ["#3498db","#9b59b6","#e67e22","#27ae60","#e74c3c"];
var DLIGHT = ["#d6eaf8","#e8daef","#fdebd0","#d5f5e3","#fadbd8"];
var cRadar, cBar, cQ, cRank;

function avg(a){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]; return a.length?s/a.length:0; }
function r1(v){ return Math.round(v*10)/10; }

function lvl(s){
  if(s<1.8) return {label:"Inicial",color:"#e74c3c",e:"🔴"};
  if(s<2.6) return {label:"Emergente",color:"#e67e22",e:"🟠"};
  if(s<3.4) return {label:"En Desarrollo",color:"#f39c12",e:"🟡"};
  if(s<4.2) return {label:"Establecido",color:"#2ecc71",e:"🟢"};
  return {label:"Avanzado",color:"#1abc9c",e:"🌟"};
}
function scol(s){
  if(s<1.8) return "#e74c3c";
  if(s<2.6) return "#e67e22";
  if(s<3.4) return "#f1c40f";
  if(s<4.2) return "#2ecc71";
  return "#1abc9c";
}

function getOrg(idx){
  var o = ORGS[idx];
  var da = [];
  for(var i=0;i<DIMS.length;i++) da.push(r1(avg(o.dimensions[DIMS[i]])));
  var tot = r1(avg(da));
  return {o:o, da:da, tot:tot};
}

function initSel(){
  var sel = document.getElementById('sel');
  for(var i=0;i<ORGS.length;i++){
    var op = document.createElement('option');
    op.value = i; op.textContent = ORGS[i].org;
    sel.appendChild(op);
  }
}

function render(){
  var idx = parseInt(document.getElementById('sel').value);
  var d = getOrg(idx);
  renderCard(d);
  renderDCards(d);
  renderRadar(d);
  renderBarDim(d);
  renderDimTbl(d);
  renderQSec(d);
  renderQBar(d);
  renderComp(idx);
}

function renderCard(d){
  var lv = lvl(d.tot);
  var el = document.getElementById('ocard');
  el.innerHTML = '';
  var info = document.createElement('div'); info.className='oinfo';
  var nm = document.createElement('div'); nm.className='oname'; nm.textContent = d.o.org; info.appendChild(nm);
  var meta = document.createElement('div'); meta.className='ometa';
  var tags = [['🌍',d.o.country],['👥','Equipo: '+d.o.team_size],['🎯','Benef: '+d.o.beneficiaries],['👤',d.o.person]];
  tags.forEach(function(t){ var sp=document.createElement('span'); sp.className='otag'; sp.textContent=t[0]+' '+t[1]; meta.appendChild(sp); });
  info.appendChild(meta);
  var mis = document.createElement('div'); mis.className='omission'; mis.textContent='📌 '+d.o.mission; info.appendChild(mis);
  el.appendChild(info);
  var sp = document.createElement('div'); sp.className='scpanel';
  var circ = document.createElement('div'); circ.className='sccircle'; circ.style.background=lv.color;
  circ.innerHTML = d.tot+'<small>/5</small>'; sp.appendChild(circ);
  var sl = document.createElement('div'); sl.className='sclabel'; sl.style.color=lv.color; sl.textContent=lv.e+' '+lv.label; sp.appendChild(sl);
  var ss = document.createElement('div'); ss.className='scsub'; ss.textContent='Madurez Digital Global'; sp.appendChild(ss);
  el.appendChild(sp);
}

function renderDCards(d){
  var el = document.getElementById('dcards'); el.innerHTML='';
  for(var i=0;i<DIMS.length;i++){
    var sc = d.da[i]; var lv = lvl(sc); var pct = (sc/5)*100;
    var c = document.createElement('div'); c.className='dcard';
    c.style.background=DLIGHT[i]; c.style.borderColor=DCOL[i];
    c.innerHTML = '<div class="dicon">'+ICONS[DIMS[i]]+'</div>'
      +'<div class="dname">'+DIMS[i]+'</div>'
      +'<div class="dscore" style="color:'+DCOL[i]+'">'+sc+'</div>'
      +'<div class="dmax">/ 5.0</div>'
      +'<div class="dbw"><div class="db" style="width:'+pct+'%"></div></div>'
      +'<div class="dlevel" style="color:'+DCOL[i]+'">'+lv.e+' '+lv.label+'</div>';
    el.appendChild(c);
  }
}

function renderRadar(d){
  if(cRadar) cRadar.destroy();
  var ctx = document.getElementById('cRadar').getContext('2d');
  var labels = DIMS.map(function(dm){ return dm.split(' ').slice(0,3).join(' '); });
  cRadar = new Chart(ctx,{type:'radar',data:{labels:labels,datasets:[{label:d.o.org,data:d.da,backgroundColor:'rgba(41,128,185,0.15)',borderColor:'#2980b9',pointBackgroundColor:DCOL,pointBorderColor:'#fff',pointRadius:6,borderWidth:2.5}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:5,ticks:{stepSize:1,font:{size:10}},pointLabels:{font:{size:11,weight:'600'}}}},plugins:{legend:{display:false}}}});
}

function renderBarDim(d){
  if(cBar) cBar.destroy();
  var ctx = document.getElementById('cBar').getContext('2d');
  var labs = DIMS.map(function(dm){ return ICONS[dm]+' '+dm.split(' ')[0]; });
  var cols = DCOL.map(function(c){ return c+'cc'; });
  cBar = new Chart(ctx,{type:'bar',data:{labels:labs,datasets:[{label:'Promedio',data:d.da,backgroundColor:cols,borderColor:DCOL,borderWidth:2,borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',scales:{x:{min:0,max:5,ticks:{stepSize:1},grid:{color:'#eef'}},y:{ticks:{font:{size:11}}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' Promedio: '+c.raw+' / 5.0';}}}}}});
}

function renderDimTbl(d){
  var html = '<thead><tr><th>Dimensión</th><th>Promedio</th><th>Avance</th><th>Nivel</th><th>Máx / Mín</th></tr></thead><tbody>';
  for(var i=0;i<DIMS.length;i++){
    var dim=DIMS[i]; var sc=d.da[i]; var lv=lvl(sc); var pct=(sc/5)*100;
    var qs=d.o.dimensions[dim]; var mn=Math.min.apply(null,qs); var mx=Math.max.apply(null,qs);
    html += '<tr>'
      +'<td>'+ICONS[dim]+' <strong>'+dim+'</strong></td>'
      +'<td><span class="pill" style="background:'+lv.color+'">'+sc+'</span></td>'
      +'<td><div class="barcell"><div class="barw"><div class="barf" style="width:'+pct+'%;background:'+DCOL[i]+'"></div></div><span style="font-size:.8rem;color:'+lv.color+';font-weight:700">'+pct.toFixed(0)+'%</span></div></td>'
      +'<td><span class="lbadge" style="background:'+lv.color+'">'+lv.e+' '+lv.label+'</span></td>'
      +'<td style="text-align:center"><span style="color:#27ae60;font-weight:700">▲'+mx+'</span> / <span style="color:#e74c3c;font-weight:700">▼'+mn+'</span></td>'
      +'</tr>';
  }
  html += '</tbody>';
  document.getElementById('dimTable').innerHTML = html;
}

function renderQSec(d){
  var el = document.getElementById('qsec'); el.innerHTML='';
  for(var di=0;di<DIMS.length;di++){
    var dim=DIMS[di]; var lbls=QLABELS[dim]; var scores=d.o.dimensions[dim];
    var da=r1(avg(scores));
    var wrap = document.createElement('div'); wrap.className='panel'; wrap.style.marginBottom='14px';
    var hdr = document.createElement('div'); hdr.className='qdh on'; hdr.style.background=DCOL[di];
    hdr.innerHTML = '<span style="font-size:1.1rem">'+ICONS[dim]+'</span><h3>'+dim+'</h3><span class="avgb">Promedio: '+da+'</span><span class="chv">▼</span>';
    hdr.onclick = (function(h){ return function(){ h.classList.toggle('on'); h.nextElementSibling.classList.toggle('on'); }; })(hdr);
    var body = document.createElement('div'); body.className='qrows on';
    var tw = document.createElement('div'); tw.className='tw';
    var thtml = '<table class="t"><thead><tr><th style="width:60%">Pregunta</th><th>Puntaje</th><th>Barra</th></tr></thead><tbody>';
    for(var qi=0;qi<lbls.length;qi++){
      var s=scores[qi]; var col=scol(s); var pct=(s/5)*100;
      thtml += '<tr>'
        +'<td style="font-size:.82rem">'+lbls[qi]+'</td>'
        +'<td><span class="pill" style="background:'+col+'">'+s+'</span></td>'
        +'<td><div class="barcell"><div class="barw"><div class="barf" style="width:'+pct+'%;background:'+col+'"></div></div></div></td>'
        +'</tr>';
    }
    thtml += '</tbody></table>';
    tw.innerHTML = thtml;
    body.appendChild(tw);
    wrap.appendChild(hdr); wrap.appendChild(body);
    el.appendChild(wrap);
  }
}

function renderQBar(d){
  if(cQ) cQ.destroy();
  var labs=[], scores=[], cols=[];
  for(var di=0;di<DIMS.length;di++){
    var dim=DIMS[di]; var qlbs=QLABELS[dim]; var qs=d.o.dimensions[dim];
    for(var qi=0;qi<qlbs.length;qi++){
      labs.push(qlbs[qi].split(' ').slice(0,3).join(' '));
      scores.push(qs[qi]);
      cols.push(DCOL[di]+'cc');
    }
  }
  var ctx = document.getElementById('cQ').getContext('2d');
  cQ = new Chart(ctx,{type:'bar',data:{labels:labs,datasets:[{label:'Puntaje',data:scores,backgroundColor:cols,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:0,max:5,ticks:{stepSize:1},grid:{color:'#eef'}},x:{ticks:{font:{size:9},maxRotation:50}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' '+c.raw+' / 5.0';}}}}}});
}

function renderComp(activeIdx){
  var rows = ORGS.map(function(o,i){
    var da = DIMS.map(function(d){ return r1(avg(o.dimensions[d])); });
    return {org:o.org, da:da, tot:r1(avg(da)), idx:i};
  });
  var sorted = rows.slice().sort(function(a,b){ return b.tot-a.tot; });
  if(cRank) cRank.destroy();
  var ctx = document.getElementById('cRank').getContext('2d');
  var rlabs = sorted.map(function(o){ return o.org.length>32?o.org.slice(0,32)+'…':o.org; });
  var rdata = sorted.map(function(o){ return o.tot; });
  var rcols = sorted.map(function(o){ return o.idx===activeIdx?'#1e3a5f':'#2980b9aa'; });
  cRank = new Chart(ctx,{type:'bar',data:{labels:rlabs,datasets:[{label:'Madurez Digital',data:rdata,backgroundColor:rcols,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',scales:{x:{min:0,max:5,ticks:{stepSize:1},grid:{color:'#eef'}},y:{ticks:{font:{size:10}}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' '+c.raw+' / 5.0 — '+lvl(c.raw).label;}}}}}});

  // Comparison table
  var thead = '<thead><tr><th>Organización</th>';
  for(var i=0;i<DIMS.length;i++) thead += '<th style="background:'+DCOL[i]+'">'+ICONS[DIMS[i]]+'<br>'+DIMS[i].split(' ')[0]+'</th>';
  thead += '<th>Total</th><th>Nivel</th></tr></thead>';
  var tbody = '<tbody>';
  rows.forEach(function(row,i){
    var lv=lvl(row.tot); var hl=(i===activeIdx)?'background:#eaf2fb;font-weight:700':'';
    tbody += '<tr style="'+hl+'">';
    tbody += '<td>'+(i===activeIdx?'▶ ':'')+row.org+'</td>';
    row.da.forEach(function(s){ tbody += '<td><span class="pill" style="background:'+scol(s)+'">'+s+'</span></td>'; });
    tbody += '<td><span class="pill" style="background:'+lv.color+'">'+row.tot+'</span></td>';
    tbody += '<td><span class="lbadge" style="background:'+lv.color+';font-size:.72rem">'+lv.e+' '+lv.label+'</span></td>';
    tbody += '</tr>';
  });
  tbody += '</tbody>';
  document.getElementById('ctbl').innerHTML = thead+tbody;
}

function swTab(name, btn){
  document.querySelectorAll('.tc').forEach(function(t){ t.classList.remove('on'); });
  document.querySelectorAll('.tb').forEach(function(b){ b.classList.remove('on'); });
  document.getElementById('tab-'+name).classList.add('on');
  btn.classList.add('on');
}

initSel();
render();
</script>
</body>
</html>
