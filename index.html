*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#1a2a3a;min-height:100vh}
header{background:linear-gradient(135deg,#0a2342 0%,#1a4a7a 100%);color:#fff;padding:22px 32px;display:flex;align-items:center;gap:18px}
header h1{font-size:1.35rem;font-weight:700;letter-spacing:.5px}
header span{font-size:.85rem;opacity:.75;margin-top:3px;display:block}
.badge-hdr{background:#e8b84b;color:#0a2342;font-weight:700;font-size:.75rem;padding:4px 10px;border-radius:20px;white-space:nowrap}
.container{max-width:1100px;margin:0 auto;padding:24px 16px}
.sel-wrap{background:#fff;border-radius:12px;padding:18px 22px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.07);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sel-wrap label{font-weight:600;font-size:.95rem;color:#0a2342}
select{flex:1;min-width:220px;padding:9px 14px;border-radius:8px;border:1.5px solid #c0d0e0;font-size:.95rem;background:#f8fafc;color:#1a2a3a;cursor:pointer}
select:focus{outline:none;border-color:#1a4a7a}
.tabs{display:flex;gap:4px;margin-bottom:18px}
.tab{padding:9px 22px;border-radius:8px 8px 0 0;border:none;background:#d8e4f0;color:#1a2a3a;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s}
.tab.active{background:#fff;color:#0a2342;border-bottom:3px solid #e8b84b}
.tab-content{display:none}.tab-content.active{display:block}
.card-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.07);text-align:center}
.card .val{font-size:2.1rem;font-weight:800;margin:6px 0 2px}
.card .lbl{font-size:.78rem;color:#5a7a9a;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.card .sub{font-size:.82rem;margin-top:4px;font-weight:600}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:700}
.lvl-1{background:#fee2e2;color:#b91c1c}
.lvl-2{background:#fef3c7;color:#92400e}
.lvl-3{background:#dbeafe;color:#1e40af}
.lvl-4{background:#d1fae5;color:#065f46}
.lvl-5{background:#ede9fe;color:#4c1d95}
.section{background:#fff;border-radius:12px;padding:20px 22px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.section h3{font-size:1rem;font-weight:700;color:#0a2342;margin-bottom:14px;border-left:4px solid #e8b84b;padding-left:10px}
.dim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:6px}
.dim-card{background:#f8fafc;border-radius:9px;padding:13px 14px;text-align:center;border:1.5px solid #e0eaf4}
.dim-card .dval{font-size:1.6rem;font-weight:800;color:#0a2342}
.dim-card .dnm{font-size:.75rem;color:#5a7a9a;font-weight:600;margin-bottom:6px}
.bar-wrap{background:#e5eef7;border-radius:4px;height:8px;margin-top:6px}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#1a4a7a,#e8b84b)}
.chart-wrap{position:relative;height:300px;margin:0 auto}
.chart-wrap-lg{position:relative;height:360px;margin:0 auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:#0a2342;color:#fff;padding:9px 12px;text-align:left;font-weight:600}
td{padding:8px 12px;border-bottom:1px solid #e8eef5}
tr:nth-child(even) td{background:#f5f8fc}
tr:hover td{background:#eaf1fb}
.q-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef2f7}
.q-row:last-child{border-bottom:none}
.q-txt{font-size:.82rem;color:#2a3a4a}
.q-score{font-size:.95rem;font-weight:700;min-width:34px;text-align:center;padding:3px 7px;border-radius:6px}
.sc1{background:#fee2e2;color:#b91c1c}.sc2{background:#fef3c7;color:#92400e}
.sc3{background:#dbeafe;color:#1e40af}.sc4{background:#d1fae5;color:#065f46}
.sc5{background:#ede9fe;color:#4c1d95}
footer{text-align:center;padding:22px;color:#7a9ab0;font-size:.8rem;margin-top:10px}
@media(max-width:600px){header{flex-direction:column;align-items:flex-start}.tabs{flex-wrap:wrap}}
</style>

<div class="container">
  <div class="sel-wrap">
    <label>Organización:</label>
    <select id="orgSel" onchange="render()"></select>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="swTab('resumen',this)">Resumen</button>
    <button class="tab" onclick="swTab('preguntas',this)">Preguntas</button>
    <button class="tab" onclick="swTab('comparacion',this)">Comparación</button>
  </div>

  <div id="resumen" class="tab-content active">
    <div id="cards" class="card-row"></div>
    <div class="section"><h3>Radar por Dimensión</h3><div class="chart-wrap"><canvas id="radarChart"></canvas></div></div>
    <div id="dimCards" class="dim-grid"></div>
    <div class="section"><h3>Puntaje Promedio por Dimensión</h3><div class="chart-wrap"><canvas id="barDimChart"></canvas></div></div>
    <div class="section"><h3>Tabla de Puntajes por Dimensión</h3><div id="dimTable"></div></div>
  </div>

  <div id="preguntas" class="tab-content">
    <div id="qSections"></div>
  </div>

  <div id="comparacion" class="tab-content">
    <div class="section"><h3>Comparación entre Organizaciones – Puntaje Total</h3><div class="chart-wrap-lg"><canvas id="compChart"></canvas></div></div>
    <div class="section"><h3>Tabla Comparativa</h3><div id="compTable"></div></div>
  </div>
</div>
<footer>iKruger · Diagnóstico de Madurez Digital · 2025-2026</footer>

<script>
var RAW = JSON.parse(document.getElementById('dataScript').textContent);
document.getElementById('orgCount').textContent = RAW.length + ' organizaciones';

var DIMS = ["Liderazgo y Estrategia","Procesos y Operaciones","Tecnología e Infraestructura","Datos e Información","Cultura y Capacidades"];
var COLORS = ["#1a4a7a","#e8b84b","#27ae60","#e74c3c","#8e44ad"];
var radarInst=null, barDimInst=null, compInst=null;

function lvl(s){
  if(s<1.8) return {t:"Inicial",c:"lvl-1"};
  if(s<2.6) return {t:"Emergente",c:"lvl-2"};
  if(s<3.4) return {t:"En Desarrollo",c:"lvl-3"};
  if(s<4.2) return {t:"Establecido",c:"lvl-4"};
  return {t:"Avanzado",c:"lvl-5"};
}
function scol(s){if(s<=1)return "sc1";if(s<=2)return "sc2";if(s<=3)return "sc3";if(s<=4)return "sc4";return "sc5";}
function pct(s){return Math.round((s-1)/4*100);}

// Populate selector
var sel = document.getElementById('orgSel');
for(var i=0;i<RAW.length;i++){
  var o = document.createElement('option');
  o.value = i; o.textContent = RAW[i].name;
  sel.appendChild(o);
}

function render(){
  var idx = parseInt(sel.value);
  var org = RAW[idx];
  renderCards(org);
  renderDimCards(org);
  renderRadar(org);
  renderBarDim(org);
  renderDimTable(org);
  renderQSections(org);
}

function renderCards(org){
  var l = lvl(org.total);
  var html = '';
  html += '<div class="card"><div class="lbl">Puntaje Global</div><div class="val" style="color:#0a2342">'+org.total+'</div><div class="sub"><span class="badge '+l.c+'">'+l.t+'</span></div></div>';
  html += '<div class="card"><div class="lbl">País</div><div class="val" style="font-size:1.1rem;padding-top:10px">'+org.pais+'</div></div>';
  for(var d=0;d<org.dims.length;d++){
    var dl = lvl(org.dims[d].avg);
    html += '<div class="card"><div class="lbl" style="font-size:.7rem">'+DIMS[d]+'</div><div class="val" style="color:'+COLORS[d]+'">'+org.dims[d].avg+'</div><div class="sub"><span class="badge '+dl.c+'">'+dl.t+'</span></div></div>';
  }
  document.getElementById('cards').innerHTML = html;
}

function renderDimCards(org){
  var html = '';
  for(var d=0;d<org.dims.length;d++){
    var p = pct(org.dims[d].avg);
    html += '<div class="dim-card"><div class="dnm">'+DIMS[d]+'</div><div class="dval">'+org.dims[d].avg+'</div><span class="badge '+lvl(org.dims[d].avg).c+'">'+lvl(org.dims[d].avg).t+'</span><div class="bar-wrap"><div class="bar-fill" style="width:'+p+'%"></div></div></div>';
  }
  document.getElementById('dimCards').innerHTML = html;
}

function renderRadar(org){
  if(radarInst){radarInst.destroy();}
  var avgs = org.dims.map(function(d){return d.avg;});
  var ctx = document.getElementById('radarChart').getContext('2d');
  radarInst = new Chart(ctx,{
    type:'radar',
    data:{
      labels:DIMS,
      datasets:[{label:org.name,data:avgs,backgroundColor:'rgba(26,74,122,0.15)',borderColor:'#1a4a7a',pointBackgroundColor:'#e8b84b',pointRadius:5,borderWidth:2}]
    },
    options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:1,max:5,ticks:{stepSize:1,font:{size:10}},pointLabels:{font:{size:11}}}},plugins:{legend:{display:false}}}
  });
}

function renderBarDim(org){
  if(barDimInst){barDimInst.destroy();}
  var avgs = org.dims.map(function(d){return d.avg;});
  var ctx = document.getElementById('barDimChart').getContext('2d');
  barDimInst = new Chart(ctx,{
    type:'bar',
    data:{
      labels:DIMS,
      datasets:[{label:'Promedio',data:avgs,backgroundColor:COLORS,borderRadius:6}]
    },
    options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:1,max:5,ticks:{stepSize:1}}},plugins:{legend:{display:false}}}
  });
}

function renderDimTable(org){
  var html = '<table><thead><tr><th>Dimensión</th><th>Promedio</th><th>Nivel</th></tr></thead><tbody>';
  for(var d=0;d<org.dims.length;d++){
    var l = lvl(org.dims[d].avg);
    html += '<tr><td>'+DIMS[d]+'</td><td><strong>'+org.dims[d].avg+'</strong></td><td><span class="badge '+l.c+'">'+l.t+'</span></td></tr>';
  }
  html += '</tbody></table>';
  document.getElementById('dimTable').innerHTML = html;
}

function renderQSections(org){
  var html = '';
  for(var d=0;d<org.dims.length;d++){
    var dim = org.dims[d];
    html += '<div class="section"><h3>'+DIMS[d]+' — Promedio: '+dim.avg+'</h3>';
    // Bar chart
    html += '<div style="position:relative;height:220px;margin-bottom:14px"><canvas id="qbar'+d+'"></canvas></div>';
    // Question list
    for(var q=0;q<dim.scores.length;q++){
      var sc = dim.scores[q];
      html += '<div class="q-row"><div class="q-txt">'+dim.labels[q]+'</div><div class="q-score '+scol(sc)+'">'+sc+'</div></div>';
    }
    html += '</div>';
  }
  document.getElementById('qSections').innerHTML = html;
  // Draw mini bar charts
  for(var d=0;d<org.dims.length;d++){
    var dim = org.dims[d];
    var labels = dim.labels.map(function(l,i){return (d+1)+'.'+(i+1);});
    var ctx2 = document.getElementById('qbar'+d).getContext('2d');
    new Chart(ctx2,{
      type:'bar',
      data:{labels:labels,datasets:[{data:dim.scores,backgroundColor:COLORS[d],borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:1,max:5}},plugins:{legend:{display:false}}}
    });
  }
}

function renderComp(){
  if(compInst){compInst.destroy();}
  var names = RAW.map(function(o){
    var n = o.name.length>22 ? o.name.substring(0,22)+'…' : o.name;
    return n;
  });
  var totals = RAW.map(function(o){return o.total;});
  var bgColors = totals.map(function(t){
    var l = lvl(t);
    var map={'lvl-1':'#fca5a5','lvl-2':'#fcd34d','lvl-3':'#93c5fd','lvl-4':'#6ee7b7','lvl-5':'#c4b5fd'};
    return map[l.c]||'#93c5fd';
  });
  var ctx3 = document.getElementById('compChart').getContext('2d');
  compInst = new Chart(ctx3,{
    type:'bar',
    data:{labels:names,datasets:[{label:'Puntaje Total',data:totals,backgroundColor:bgColors,borderRadius:5}]},
    options:{
      indexAxis:'y',
      responsive:true,maintainAspectRatio:false,
      scales:{x:{min:1,max:5}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return ' '+c.raw+' — '+lvl(c.raw).t;}}}}
    }
  });
  // Table
  var sorted = RAW.slice().sort(function(a,b){return b.total-a.total;});
  var thtml = '<table><thead><tr><th>#</th><th>Organización</th><th>País</th><th>Total</th>';
  for(var d=0;d<5;d++) thtml += '<th style="font-size:.75rem">'+DIMS[d].split(' ')[0]+'</th>';
  thtml += '<th>Nivel</th></tr></thead><tbody>';
  for(var i=0;i<sorted.length;i++){
    var o = sorted[i];
    var l = lvl(o.total);
    thtml += '<tr><td>'+(i+1)+'</td><td>'+o.name+'</td><td>'+o.pais+'</td><td><strong>'+o.total+'</strong></td>';
    for(var d=0;d<5;d++) thtml += '<td>'+o.dims[d].avg+'</td>';
    thtml += '<td><span class="badge '+l.c+'">'+l.t+'</span></td></tr>';
  }
  thtml += '</tbody></table>';
  document.getElementById('compTable').innerHTML = thtml;
}

function swTab(id, btn){
  document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.tab').forEach(function(el){el.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if(id==='comparacion') renderComp();
}

render();
</script>
</body>
</html>
